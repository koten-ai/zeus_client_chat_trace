<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeus Tracer v1 — Embed Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: 0.45rem 0.85rem; cursor: pointer; margin: 0 0.25rem 0.5rem 0; }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <h1>Host page</h1>
  <p>Embeddable Zeus Tracer v1 inspector. Panel is <strong>on</strong> for this demo (<code>enabled: true</code>). Production hosts use <code>?debug=true</code>.</p>
  <p>
    <button type="button" id="run-legacy">Legacy fixture</button>
    <button type="button" id="run-v230">v2.3.0 healthy</button>
    <button type="button" id="run-fail">Failed hop + Diagnosis</button>
    <button type="button" id="run-cache">Semantic cache</button>
    <button type="button" id="run-job">Job units</button>
    <button type="button" id="open">Open panel</button>
  </p>
  <p><a href="/sketches/v1-overlay-inspector/">Static overlay mockup</a></p>

  <script>
    window.ZeusTraceConfig = {
      zeusApiUrl: "http://localhost:8080",
      zeusAuthToken: "",
      // Host config — all Detective / Hub redirects use this origin.
      hubBaseUrl: "http://hub",
      enabled: true,
    };

    const legacy = {
      chat_id: "demo-chat-1",
      session_id: "demo-sess-001",
      session_round: 2,
      contract_status: "match",
      api_version: "v2",
      target: "yelp-demo/_default/_default",
      answer: "Paris is lovely in spring.",
      trace: {
        rounds: 2,
        total_ms: 1880,
        spans: [
          { name: "llm.round1", cls: "ai", at: 0, ms: 1100 },
          { name: "tool.search", cls: "tool", at: 1100, ms: 560 },
          { name: "llm.round2", cls: "ai", at: 1660, ms: 220 },
        ],
        steps: [
          { type: "llm", round: 1, ms: 1100, finish_reason: "tool_calls", tool_calls: ["search"], usage: { prompt_tokens: 800, completion_tokens: 40, total_tokens: 840 } },
          { type: "tool", round: 1, name: "search", status: 200, ms: 560, bytes: 4096 },
          { type: "llm", round: 2, ms: 220, finish_reason: "stop", usage: { prompt_tokens: 900, completion_tokens: 80, total_tokens: 980 } },
        ],
        ai_requests: [{ model: "grok-4" }, { model: "grok-4" }],
        ai_responses: [{ finish_reason: "tool_calls" }, { finish_reason: "stop" }],
        catalog: { has_mini_schema: true, has_scope_brief: true },
      },
    };

    const v230 = {
      question: "How many IPA breweries are in Colorado with abv > 6.5?",
      chat_id: "chat-v230",
      session_id: "sess_8f3a2c91",
      session_round: 3,
      contract_status: "match",
      debug: {
        turn_id: "turn_8f3a2c91-b4e0",
        session_id: "sess_8f3a2c91",
        preferred_req_id: "25ef66c2-aa11",
        client_version: "2.3.0",
        catalog: { has_mini_schema: true, has_scope_brief: true, base_id: "base-5.3", client_floor: "5" },
        tokens: { prompt: 4102, completion: 388, total: 4490, cached: 512, ok: true },
        stamp: { user: "zeus_client" },
        hops: [
          { req_id: "25ef66c2-aa11", name: "search", status: 200, ms: 360, bytes: 6144, preferred: true, req: { q: "IPA Colorado" }, res: { rows: 47 } },
          { req_id: "aa11c90e-bb22", name: "pipeline", status: 200, ms: 200, bytes: 2048 },
        ],
        detective: {
          diagnosis: { grade: "pass", headline: "Healthy turn", overview: "Preferred hop returned rows." },
          prompt: { items: [{ lab: "MINI-SCHEMA", ok: true }, { lab: "SCOPE BRIEF", ok: true }] },
        },
        public_trace: {
          rounds: 2,
          total_ms: 1810,
          notes: [],
          steps: [
            { type: "llm", round: 1, ms: 1000, finish_reason: "tool_calls" },
            { type: "tool", round: 1, name: "search", status: 200, ms: 360 },
            { type: "tool", round: 1, name: "pipeline", status: 200, ms: 200 },
            { type: "llm", round: 2, ms: 250, finish_reason: "stop" },
          ],
          layer_a: { confidence: "high", policy_action: "answer", ok: true },
          inject: { has_mini_schema: true, has_scope_brief: true },
        },
      },
    };

    const fail = {
      question: "Count salons in Tampa",
      session_id: "sess-fail",
      session_round: 1,
      contract_status: "drift",
      debug: {
        turn_id: "turn-fail",
        preferred_req_id: "req-fail",
        hops: [{ req_id: "req-fail", name: "search", status: 500, ms: 40, bytes: 96, res: { error: "0 rows" } }],
        detective: {
          diagnosis: { grade: "warn", headline: "0-row hop then broaden", overview: "Relax the city filter." },
          playbooks: [{ id: "relax_filter", title: "Relax filter", body: "Drop exact city match." }],
        },
        public_trace: { rounds: 1, steps: [{ type: "tool", name: "search", status: 500, ms: 40 }], notes: [] },
      },
    };

    const cache = {
      question: "What did we decide about Denver?",
      session_id: "sess-cache",
      debug: {
        turn_id: "turn-cache",
        notes: ["semantic_cache.recall: blocks=2"],
        stamp: { user: "zeus_client" },
        public_trace: {
          notes: ["semantic_cache.recall: blocks=2"],
          inject: { has_mini_schema: true, semantic_memory: "User prefers IPA." },
          steps: [{ type: "llm", ms: 180, finish_reason: "stop" }],
        },
      },
    };

    const job = {
      question: "Plan Paris to SF",
      trace: {
        multi_agent: true,
        job_id: "job_travel_paris_sf",
        pack: "travel",
        engine: "local_units",
        units: [
          { unit_id: "u_agent_1", status: "ok", kind: "agent_turn", goal: "Plan Paris → SF", wave: 1, req_ids: ["r1"], hops: [{ req_id: "r1", verb: "search", status: 200, ms: 90, bytes: 1024 }] },
          { unit_id: "u_direct_2", status: "ok", kind: "zeus_direct", goal: "find flights", wave: 1, req_ids: ["r2"] },
        ],
      },
    };

    window.appendTraceCard("early queued query", {
      chat_id: "demo-chat-1",
      session_id: "demo-sess-early",
      api_version: "v2",
      target: "demo",
      answer: "Early answer",
      trace: {
        rounds: 1,
        total_ms: 420,
        hops: [{ req_id: "early", name: "search", status: 200, ms: 240 }],
        steps: [
          { type: "llm", round: 1, ms: 180, finish_reason: "tool_calls" },
          { type: "tool", round: 1, name: "search", status: 200, ms: 240, bytes: 4096 },
        ],
      },
    });
  </script>
  <script src="/dist/zeus_client_chat_trace.js" async></script>
  <script>
    const click = (id, fn) => document.getElementById(id).addEventListener("click", fn);
    click("run-legacy", () => window.appendTraceCard("Find hotels in Paris", legacy));
    click("run-v230", () => window.appendTraceCard(v230.question, v230));
    click("run-fail", () => window.appendTraceCard(fail.question, fail));
    click("run-cache", () => window.appendTraceCard(cache.question, cache));
    click("run-job", () => window.appendTraceCard(job.question, job));
    click("open", () => window.openDebugPanel?.());
  </script>
</body>
</html>
